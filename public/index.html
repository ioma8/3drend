<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>3drend — Doom</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #101418;
      color: #9aa4af;
      font: 13px/1.5 system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: flex-start;
    }
    #view {
      width: min(800px, 100%);
      height: auto;
      aspect-ratio: 16 / 9;
      border: 1px solid #333;
      background: #000;
      cursor: crosshair;
    }
    #hud { opacity: 0.7; }
  </style>
</head>
<body>
  <canvas id="view" width="800" height="450"></canvas>
  <div id="hud">WASD move &middot; mouse look (click to lock) &middot; click / space fire &middot; right-click / E use door &middot; 1/2/3 weapons</div>
  <script type="module" src="/js/main.js?v=3"></script>
</body>
</html>
