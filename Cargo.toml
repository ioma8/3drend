[package]
name = "drend"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

# Native desktop frontend (winit). Built with: cargo run --features native
[[bin]]
name = "drend"
path = "src/main.rs"
required-features = ["native"]

[features]
default = []
native = ["dep:winit", "dep:image", "dep:pollster"]

# Local fix: macOS 26 reports occlusion state with different bit values, so
# wgpu's check never sees the window as visible (issue #9430) and nothing is
# ever presented. Patch uses the window's isVisible property instead.
[patch.crates-io]
wgpu-hal = { path = "vendor/wgpu-hal" }

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "30", features = ["web"] }
bytemuck = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
futures-channel = "0.3"

# native frontend only
winit = { version = "0.30", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["jpeg", "png"] }
pollster = { version = "0.4", optional = true }
